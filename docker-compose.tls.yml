# FloorForge – optionales TLS-Overlay (Caddy + automatisches Let's Encrypt)
#
# Nutzung:
#   DOMAIN=floorforge.example.com docker compose \
#     -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Caddy übernimmt Port 80/443 und terminiert TLS; das Frontend ist nur noch
# intern (floorforge_internal-Netzwerk) erreichbar, nicht mehr direkt über
# APP_PORT auf dem Host – `!reset` überschreibt die Basis-Portfreigabe
# vollständig statt sie zu ergänzen (erfordert Docker Compose ≥ 2.24; bei
# älteren Versionen stattdessen die `ports:`-Zeile für `frontend` in
# docker-compose.yml auskommentieren).
services:
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: floorforge_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required, e.g. floorforge.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
    name: floorforge_caddy_data
  caddy_config:
    name: floorforge_caddy_config
