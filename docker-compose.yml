name: floorforge

services:
  # ────────────────────────────────────────
  # PostgreSQL 16
  # ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: floorforge_db
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-floorforge}
      POSTGRES_USER: ${DB_USER:-floorforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-floorforge} -d ${DB_NAME:-floorforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────
  # Redis 8
  # ────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: floorforge_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────
  # Backend (Node.js / Express)
  # ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-production}
    container_name: floorforge_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-floorforge}
      DB_USER: ${DB_USER:-floorforge}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SHARE_LINK_EXPIRES_HOURS: ${SHARE_LINK_EXPIRES_HOURS:-72}
    volumes:
      - exports_data:/app/exports
      - backups_data:/app/backups
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ────────────────────────────────────────
  # Frontend (React/Vite → Nginx)
  # ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: floorforge_frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
    name: floorforge_db_data
  redis_data:
    name: floorforge_redis_data
  exports_data:
    name: floorforge_exports_data
  backups_data:
    name: floorforge_backups_data

networks:
  internal:
    name: floorforge_internal
    driver: bridge
    internal: false  # Frontend braucht Port-Zugang von außen
