# ================================================
# OpenFloorball – Nginx Konfiguration
# ================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Kompression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Proxy → Backend
    location /api/ {
        # Nginx-Default (1MB) liegt weit unter dem, was z.B. GIF-/MP4-/PDF-
        # Export und Frame-Share brauchen (mehrere Base64-PNG-Frames im
        # Body) – das Backend erlaubt dafür bereits bis zu 50mb
        # (routes/exports.js, express.json({ limit: '50mb' })), das war
        # ohne dieses Limit hier aber wirkungslos: Nginx hat Requests über
        # 1MB schon vorher mit 413 abgewiesen, bevor sie das Backend
        # überhaupt erreichen.
        client_max_body_size 50m;
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Health Proxy
    location /health {
        proxy_pass http://backend:3001/health;
    }

    # Service Worker + Workbox-Runtime (Issue #49): NIE lang cachen, sonst
    # merkt der Browser neue Deploys/Bugfixes nie (bricht registerType:
    # 'autoUpdate') – muss VOR der allgemeinen Asset-Regel stehen, da Nginx
    # unter mehreren passenden Regex-Locations die zuerst im Config-File
    # stehende nimmt.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # Statische Assets mit langem Cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router – alle Routen zum index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fehlerseiten
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
