name: "✨ Feature Request"
description: "Eine neue Funktion vorschlagen"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "## ✨ Feature Request\nBeschreibe deine Idee so genau wie möglich."
  - type: input
    id: title
    attributes:
      label: "Feature-Titel"
      placeholder: "Was soll hinzugefügt werden?"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivation"
      placeholder: "Welches Problem löst dieses Feature?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Gewünschte Lösung"
      placeholder: "Wie stellst du dir das vor?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternativen"
      placeholder: "Hast du andere Lösungen in Betracht gezogen?"
  - type: dropdown
    id: priority
    attributes:
      label: "Priorität"
      options:
        - "Niedrig"
        - "Mittel"
        - "Hoch"
        - "Kritisch"
    validations:
      required: true
